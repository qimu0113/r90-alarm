distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists

# ===========================================================================
# 【备选】官方源版本 —— 与 gradle-wrapper.properties 内容相同，只有下载地址不同。
#
# 用法（二选一）：
#   cp gradle/wrapper/gradle-wrapper-official.properties \
#      gradle/wrapper/gradle-wrapper.properties
#
#   或在 PowerShell 里：
#   Copy-Item gradle\wrapper\gradle-wrapper-official.properties
#             gradle\wrapper\gradle-wrapper.properties -Force
#
# 什么时候需要切过来：
#   - 腾讯镜像不可用（404 / 连接超时 / sha256 校验失败）
#   - 你在境外，直连官方比走国内镜像快
#
# 校验值两个文件完全一样 —— 镜像与官方是同一份产物（已实测 sha256 一致），
# 所以切换 URL 时不需要动 distributionSha256Sum。
# ===========================================================================
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip

# 官方发布值，来源 https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256
distributionSha256Sum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab

networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
