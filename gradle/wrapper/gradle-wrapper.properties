distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists

# Gradle 发行包下载地址。
#
# 为什么用腾讯镜像：官方源 services.gradle.org 在国内实测长期只有几百 KB/s，
# 首次构建要下 136 MB，很容易卡住甚至失败。腾讯镜像实测约 15 MB/s（136 MB 用 9 秒）。
#
# 这个地址只在**第一次**构建时用到 —— 下过一次就缓存在本地
# （GRADLE_USER_HOME/wrapper/dists），之后不再联网。
#
# 如果哪天这个镜像不可用（404 / 连接超时），改成官方地址即可：
#   distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
# 校验值不用动 —— 镜像与官方是同一份产物（已实测 sha256 一致）。
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip

# 发行包校验值（官方发布值）。
# 作用：万一镜像被劫持或内容被替换，Gradle 会在解压前直接拒绝，
# 不会执行来路不明的构建工具。
# 来源：https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256
distributionSha256Sum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab

networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
