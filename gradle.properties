android.useAndroidX=true
kotlin.code.style=official

# 压掉 AGP 的「项目路径含非 ASCII 字符」警告。
#
# 本工程的正本目录是纯 ASCII 路径，所以这里其实用不到。
# 保留是因为：别人可能把仓库 clone 到含中文的目录下。
# AGP 默认会对这种情况打一条很唬人的 WARNING
# （"will most likely cause the build to fail on Windows"），
# 但实测：中文路径**不影响 assembleDebug**，只会让 testDebugUnitTest 挂
# （Windows 上测试 worker 传不了非 ASCII classpath）。
# 这个属性只是让输出干净，官方属性，见 b.android.com/95744。
android.overridePathCheck=true

# ⚠️ 这里**故意不写** org.gradle.java.home。
#
# 本机 JDK 路径是「每台机器都不同的东西」，写进仓库会让别人 clone 下来构建直接失败。
# 需要固定 JDK 的话，放到用户级配置文件里：
#   GRADLE_USER_HOME/gradle.properties   或   ~/.gradle/gradle.properties
#      org.gradle.java.home=/path/to/jdk
# 不写也可以 —— 只要 JAVA_HOME 指向 JDK 17+ 就行（AGP 8.6.1 支持 17–21）。

# 小工程，2 GB 足够
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
